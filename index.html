:root{font-family:"Barlow",system-ui,sans-serif;background:#101821;color:#f1f7fb}

#game[data-mode=boss]{--accent:#ffb581;background:radial-gradient(ellipse at 50% 0%,#533043,#222139 60%)}

#pitch::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12%;aspect-ratio:1;border:2px solid #e5ffed;border-radius:50%}

.roster strong{display:block;margin-bottom:6px}.roster span{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;margin:3px;border-radius:5px;background:#274a5a;color:#c8eeff;font-weight:800}.roster .infected span{background:#47632b;color:#e9ff9a}

.boss::before{content:"";position:absolute;background:#ffdf96;width:16%;height:16%;top:41%;left:22%;box-shadow: min(12.4vw,58px) 0 #ffdf96}
.boss::after{content:"";position:absolute;background:#2b1940;width:30%;height:11%;top:68%;left:35%}

won won;wind wound wound;withdraw withdrew withdrawn;withhold withheld withheld;withstand withstood withstood;wring wrung wrung;write wrote written".split(";").map(line => line.split(" "));

function shuffle(cards) {
  const bag = [...cards];
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
  return bag;
}

function draw() {
  const due = state.retries.findIndex(item => item.due <= state.answered);
  if (due >= 0) return state.retries.splice(due, 1)[0].question;
  if (!state.bag.length) state.bag = shuffle(state.cards);
  const available = state.bag.findIndex(card =>
    card !== state.current?.card && !state.retries.some(item => item.question.card === card));
  if (available < 0) {
    const fresh = state.cards.filter(card => card !== state.current?.card &&
      !state.retries.some(item => item.question.card === card));
    if (fresh.length) state.bag = shuffle(fresh);
  }
  const index = state.bag.findIndex(card =>
    card !== state.current?.card && !state.retries.some(item => item.question.card === card));
  const card = state.bag.splice(Math.max(0, index), 1)[0];
  const side = state.direction === "mix" ? Number(Math.random() < 0.5) : Number(state.direction);
  return {card, side};
}

function meters() {
  if (state.mode !== "boss") return;
  el("hp").value = state.hp;
  el("hearts").value = state.hearts;
  el("hpLabel").textContent = "Boss · " + state.hp + "/8 LP";
  el("heartsLabel").textContent = "Ihr · " + state.hearts + "/4 Herzen";
}

function question() {
  if (state.mode === "zombie" && state.target == null) {
    chooseTarget();
    return;
  }
  delete el("game").dataset.hit;
  state.current = draw();
  state.pending = true;
  el("turn").textContent = state.mode === "football" ? "Team " + (state.team + 1) + " ist dran" : state.mode === "zombie" ? playerName(state.target) + " verteidigt sich" : "Person " + (state.answered % state.count + 1) +
    " ist dran · Serie " + state.streak + "/3";
  el("word").textContent = state.current.card[state.current.side];
  el("feedback").textContent = "";
  el("answerKey").hidden = true;
  el("judge").hidden = state.typed;
  el("typedAnswer").hidden = !state.typed;
  el("typedAnswer").reset();
  el("answerLabel").textContent = state.verbs ? "Simple Past" : "Antwort";
  el("partAnswer").hidden = !state.verbs;
  el("partInput").required = state.verbs;
  el("next").hidden = true;
  el(state.typed ? "answerInput" : "word").focus();
}

function currentSolution() {
  const {card,side} = state.current;
  return state.verbs ? card[1] + " · " + card[2] : card[1-side];
}

el("revealAnswer").onclick = () => {
  el("answerKey").textContent = "Lösung: " + currentSolution();
  el("answerKey").hidden = false;
};

function normalizeAnswer(value) {
  return value.normalize("NFC").trim().replace(/\s+/g," ").toLowerCase();
}

el("typedAnswer").onsubmit = event => {
  event.preventDefault();
  if (!state?.pending || !state.typed) return;
  const matches = (input, solution, separator) =>
    [solution, ...solution.split(separator)].some(form => normalizeAnswer(form) === normalizeAnswer(input));
  const {card,side} = state.current;
  const answer = el("answerInput").value;
  if (state.verbs) {
    judge(matches(answer,card[1],"/") && matches(el("partInput").value,card[2],"/"));
  } else {
    judge(matches(answer,card[1-side],/;|\s+\/\s+/));
  }
};
function judge(correct) {
  if (!state.pending) return;
  state.pending = false;
  el("game").dataset.hit = correct ? "right" : "wrong";
  state.answered++;
  const solution = currentSolution();
  el("typedAnswer").hidden = true;
  el("answerKey").hidden = true;
  if (state.mode !== "boss") {
    judgeTeam(correct, solution);
    return;
  }
  let message;
  if (correct) {
    state.streak++;
    const bonus = state.streak === 3;
    state.hp = Math.max(0, state.hp - (bonus ? 2 : 1));
    if (bonus) state.streak = 0;
    message = bonus ? "Bonusangriff! Der Boss verliert 2 LP." : "Treffer! Der Boss verliert 1 LP.";
  } else {
    state.hearts--;
    state.streak = 0;
    if (!state.retries.some(item => item.question.card === state.current.card &&
      item.question.side === state.current.side)) {
      state.retries.push({question: state.current, due: state.answered + Math.min(2, state.cards.length - 1)});
    }
    message = "Richtige Lösung: " + solution;
  }
  meters();
  el("feedback").textContent = message;
  el("judge").hidden = true;
  if (state.hp === 0 || state.hearts === 0) {
    el("turn").textContent = "Kampf beendet";
    el("word").textContent = state.hp === 0 ? "Boss besiegt!" : "Der Boss hat gewonnen.";
    el("back").focus();
    return;
  }
  el("next").hidden = false;
  el("next").focus();
}

el("config").addEventListener("submit", event => {
  event.preventDefault();
  const verbs = el("vocabSource").value === "verbs";
  const saved = el("vocabSource").value === "saved";
  const customCards = saved ? selectedDeckCards() : parsePairs(el("pairs").value);
  const size = el("verbLength").value;
  const cards = verbs ? shuffle(verbBank).slice(0, size === "all" ? verbBank.length : Number(size)) : customCards;
  const bad = verbs ? -1 : cards.findIndex(card => card.length !== 2 || card.some(part => !part));
  const error = el("error");
  error.hidden = Boolean(cards.length && bad < 0);
  if (!error.hidden) {
    error.textContent = saved && !cards.length ? "Wähle mindestens eine gespeicherte Liste aus." : bad >= 0 ? "Bitte prüfe Wortpaar " + (bad + 1) + "." : "Bitte gib mindestens ein Wortpaar ein.";
    return;
  }
  const mode = el("mode").value;
  const players = Number(el("players").value);
  const zombies = Number(el("zombies").value);
  if (mode === "zombie" && zombies >= players) {
    error.hidden = false;
    error.textContent = "Mindestens eine Person muss als Überlebende starten.";
    return;
  }
  const names = el("names").value.split(/\r?\n/).map(name => name.trim());
  state = {mode, names, verbs, typed:el("answerMode").value === "typed", ball:3, team:0, goals:[0,0], goalLimit:Number(el("goals").value),
    attackers:Array.from({length:zombies}, (_, i) => i + 1),
    survivors:Array.from({length:Math.max(0, players - zombies)}, (_, i) => zombies + i + 1),
    maxAttacks:Number(el("attacks").value), target:null, cards, bag:shuffle(cards), retries:[], count:Number(el("count").value),
    direction:verbs ? "0" : el("direction").value, hp:8, hearts:4, streak:0, answered:0};
  el("setup").hidden = true;
  el("game").hidden = false;
  el("bossMeters").hidden = mode !== "boss";
  el("bossIcon").hidden = mode !== "boss";
  el("game").dataset.mode = mode;
  el("roster").hidden = mode !== "zombie";
  el("pitch").hidden = mode !== "football";
  el("pitch").replaceChildren();
  el("score").hidden = mode === "boss";
  el("targets").replaceChildren();
  meters();
  renderTeam();
  question();
});
el("correct").onclick = () => judge(true);
el("wrong").onclick = () => judge(false);
el("next").onclick = question;
el("back").onclick = () => {
  el("game").hidden = true;
  el("setup").hidden = false;
  el("pairs").focus();
};

function renderTeam() {
  if (state.mode === "football") {
    el("score").textContent = "Team 1  ·  " + state.goals.join(" : ") + "  ·  Team 2";
    const pitch = el("pitch");
    pitch.style.setProperty("--ball", ((state.ball + 0.5) * 100 / 7) + "%");
    pitch.setAttribute("aria-label", "Ball auf Position " + (state.ball + 1) + " von 7");
    if (!pitch.children.length) pitch.replaceChildren(...Array.from({length:7}, (_, index) => {
      const tile = document.createElement("span");
      tile.textContent = index === 0 || index === 6 ? "🥅" : "·";
      tile.setAttribute("aria-hidden", "true");
      return tile;
    }));
    if (!el("pitchBall")) {
      const ball = document.createElement("div");
      ball.id = "pitchBall";
      ball.textContent = "⚽";
      ball.setAttribute("aria-hidden", "true");
      pitch.append(ball);
    }
  }
  if (state.mode === "zombie") {
    el("roster").replaceChildren(rosterGroup("Zombies", state.attackers, true), rosterGroup("Überlebende", state.survivors, false));
    el("score").textContent = "Angriffe: " + state.answered + "/" + state.maxAttacks;
  }
}

function playerName(id) {
  return state.names[id - 1] || "Person " + id;
}

function rosterGroup(label, people, infected) {
  const group = document.createElement("div");
  group.classList.toggle("infected", infected);
  const title = document.createElement("strong");
  title.textContent = label + " · " + people.length;
  group.append(title);
  for (const person of people) {
    const badge = document.createElement("span");
    badge.textContent = playerName(person);
    group.append(badge);
  }
  return group;
}

function chooseTarget() {
  el("typedAnswer").hidden = true;
  el("answerKey").hidden = true;
  const targets = el("targets");
  el("turn").textContent = "Zombies wählen die nächste Person";
  el("word").textContent = "Wer verteidigt sich?";
  el("feedback").textContent = "";
  el("judge").hidden = true;
  el("next").hidden = true;
  targets.replaceChildren(...state.survivors.map(person => {
    const button = document.createElement("button");
    button.textContent = playerName(person);
    button.onclick = () => {
      state.target = person;
      targets.replaceChildren();
      question();
    };
    return button;
  }));
  targets.firstElementChild?.focus();
}

function judgeTeam(correct, solution) {
  const message = correct ? "Richtig!" : "Richtige Lösung: " + solution;
  let result = "";
  let event = "";
  if (state.mode === "football") {
    if (correct) state.ball += state.team === 0 ? 1 : -1;
    if (state.ball === 0 || state.ball === 6) {
      state.goals[state.team]++;
      event = " Tor für Team " + (state.team + 1) + "!";
      if (state.goals[state.team] === state.goalLimit) result = "Team " + (state.team + 1) + " gewinnt!";
      else state.ball = 3;
    }
    state.team = 1 - state.team;
  } else {
    if (!correct) {
      state.survivors = state.survivors.filter(person => person !== state.target);
      state.attackers.push(state.target);
      event = " " + playerName(state.target) + " wird zum Zombie!";
    }
    state.target = null;
    if (!state.survivors.length) result = "Die Zombies gewinnen!";
    else if (state.answered === state.maxAttacks) result = "Die Überlebenden gewinnen!";
  }
  renderTeam();
  el("feedback").textContent = message + event;
  el("judge").hidden = true;
  if (result) {
    el("turn").textContent = "Spiel beendet";
    el("word").textContent = result;
    el("back").focus();
  } else {
    el("next").hidden = false;
    el("next").focus();
  }
}

function setupMode() {
  const mode = el("mode").value;
  const verbs = el("vocabSource").value === "verbs";
  el("verbLengthWrap").hidden = !verbs;
  const custom = el("vocabSource").value === "custom";
  el("customVocabulary").hidden = !custom;
  el("decksPanel").hidden = verbs;
  el("deckPicker").hidden = custom || verbs;
  el("deckSave").hidden = !custom;
  el("deckTitle").closest("label").hidden = !custom;
  el("direction").closest("label").hidden = verbs;
  el("pairs").required = custom;
  el("bossOptions").hidden = mode !== "boss";
  el("footballOptions").hidden = mode !== "football";
  el("zombieOptions").hidden = mode !== "zombie";
  for (const id of ["players", "zombies", "attacks"]) el(id).disabled = mode !== "zombie";
}
el("mode").onchange = setupMode;
el("vocabSource").onchange = setupMode;
setupMode();


function plausibleEntry(text) {
  const words = text.match(/\p{L}[\p{L}'’.-]*/gu) ?? [];
  if (!words.length || words.length > 9 || text.length > 100) return false;
  if (/^\s*(?:unit|lesson|chapter|seite|page|kapitel|lektion|übungen?|exercises?|examples?|beispiele?|vocabulary|wortschatz|vokabeln|english|deutsch)\s*[\d:.\-]*\s*$/iu.test(text)) return false;
  if (/^[„“"»(]\s*|\b(?:e\.g\.|z\.\s*b\.|example:|beispiel:)|[!?]$|[.]\s+\p{Lu}/iu.test(text)) return false;
  if (words.length >= 3 && /\.$/.test(text)) return false;
  return !/^(?:S\.|p\.)?\s*\d+[\s\d./–-]*$/i.test(text);
}


let cropImage, cropBoxes = [], dragStart, scanning = false, requestId = 0;
const canvas = el("cropCanvas");
function box(a,b) {
  return {x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)};
}
function redraw(preview) {
  const ctx=canvas.getContext("2d");
  ctx.drawImage(cropImage,0,0);
  for(const [i,r] of [...cropBoxes,...(preview?[preview]:[])].entries()) {
    ctx.strokeStyle=i?"#137de5":"#008354";
    ctx.fillStyle=i?"#137de533":"#00835433";
    ctx.lineWidth=4;
    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeRect(r.x,r.y,r.w,r.h);
  }
  el("cropHelp").textContent=[
    "Markiere die englischen Stichwörter in der Tabelle.",
    "Markiere die deutschen Übersetzungen in denselben Zeilen. Lass die Beispielsätze aus.",
    "Beide Spalten markiert. Starte die Texterkennung."
  ][cropBoxes.length];
  el("ocr").disabled=scanning || cropBoxes.length!==2;
}
function point(event) {
  const r=canvas.getBoundingClientRect();
  return {x:Math.min(canvas.width,Math.max(0,(event.clientX-r.left)*canvas.width/r.width)),
    y:Math.min(canvas.height,Math.max(0,(event.clientY-r.top)*canvas.height/r.height))};
}
canvas.onpointerdown=event=>{
  if(scanning || cropBoxes.length===2 || event.button!==0 || !event.isPrimary)return;
  canvas.setPointerCapture(event.pointerId);
  dragStart=point(event);
};
canvas.onpointermove=event=>{if(dragStart && event.isPrimary)redraw(box(dragStart,point(event)));};
canvas.onpointerup=event=>{
  if(!dragStart || !event.isPrimary)return;
  const r=box(dragStart,point(event));
  dragStart=null;
  if(r.w>12 && r.h>12)cropBoxes.push(r);
  redraw();
};
canvas.onpointercancel=()=>{dragStart=null;redraw();};
el("resetCrop").onclick=()=>{
  cropBoxes=[];
  el("review").hidden=true;
  redraw();
};
el("scan").onchange=async()=>{
  const id=++requestId, file=el("scan").files[0];
  cropBoxes=[];
  el("review").hidden=true;
  el("cropPanel").hidden=true;
  el("scanStatus").textContent="";
  if(!file)return;
  const url=URL.createObjectURL(file);
  try{
    const image=new Image();
    image.src=url;
    await image.decode();
    if(id!==requestId)return;
    cropImage=image;
    canvas.width=image.naturalWidth;
    canvas.height=image.naturalHeight;
    el("cropPanel").hidden=false;
    redraw();
  }catch{
    if(id===requestId)el("scanStatus").textContent="Das Bild konnte nicht geöffnet werden.";
  }finally{URL.revokeObjectURL(url);}
};


function clearTableRules(ctx,width,height) {
  const image=ctx.getImageData(0,0,width,height);
  const gray=new Uint8Array(width*height);
  const mask=new Uint8Array(gray.length);
  for(let i=0;i<gray.length;i++) {
    const k=i*4;
    gray[i]=Math.round(.3*image.data[k]+.59*image.data[k+1]+.11*image.data[k+2]);
  }
  const stride=Math.max(3,Math.floor(width/85));
  const radius=Math.max(2,Math.round(width/315));
  for(let slope=-.14;slope<=.061;slope+=.0125) {
    for(let y=0;y<height;y+=radius) {
      let hit=0,total=0;
      for(let x=0;x<width;x+=stride) {
        const cy=y+Math.round((x-width/2)*slope);
        if(cy<radius || cy>=height-radius)continue;
        total++;
        for(let dy=-radius;dy<=radius;dy++) {
          if(gray[(cy+dy)*width+x]<191){hit++;break;}
        }
      }
      if(total<width/stride*.75 || hit<total*.64)continue;
      for(let x=0;x<width;x++) {
        const cy=y+Math.round((x-width/2)*slope);
        for(let dy=-radius;dy<=radius;dy++) {
          const row=cy+dy;
          if(row<0 || row>=height)continue;
          const k=row*width+x;
          if(gray[k]>95 || (gray[k-width*(radius+1)]>148 && gray[k+width*(radius+1)]>148))mask[k]=1;
        }
      }
    }
  }
  for(let i=0;i<gray.length;i++) {
    const value=mask[i] || gray[i]>177 ? 255 : Math.max(0,Math.round((gray[i]-25)*1.5));
    image.data[i*4]=image.data[i*4+1]=image.data[i*4+2]=value;
  }
  ctx.putImageData(image,0,0);
}

function columnLines(data, offset, scale) {
  return (data.lines ?? []).filter(line => line.bbox).map(({text,bbox}) => ({
    text:text.trim(), y:offset+(bbox.y0+bbox.y1)/2/scale, height:(bbox.y1-bbox.y0)/scale
  })).filter(line=>line.text).sort((a,b)=>a.y-b.y);
}

function pairColumns(left,right) {
  const entries=left.map(line=>({...line,text:line.text.replace(/^[\s\d\u2022\u00b7.*-]+/,"").split(/[\[\/]/,1)[0].trim()}))
    .filter(line=>plausibleEntry(line.text));
  const answers=right.filter(line=>plausibleEntry(line.text));
  if(!entries.length || !answers.length)return [];
  const median=values=>[...values].sort((a,b)=>a-b)[Math.floor(values.length/2)];
  const step=median(entries.slice(1).map((line,i)=>line.y-entries[i].y)) || entries[0].height*2;
  const nearest=(lines,y)=>lines.reduce((a,b)=>Math.abs(a.y-y)<=Math.abs(b.y-y)?a:b);
  const offset=median(entries.map(line=>nearest(answers,line.y).y-line.y));
  const tolerance=Math.max(3,step*.37);
  const matches=new Map();
  for(const answer of answers){
    const entry=nearest(entries,answer.y-offset);
    if(Math.abs(entry.y+offset-answer.y)<=tolerance && !matches.has(entry))matches.set(entry,answer);
  }
  const used=new Set(matches.values());
  return entries.flatMap((entry,i)=>{
    const answer=matches.get(entry);
    if(!answer)return [];
    const next=answers[answers.indexOf(answer)+1];
    const continuation=next && !used.has(next) && next.y-answer.y<step*.75 &&
      next.y<(entries[i+1]?.y??Infinity)+offset-tolerance;
    return [[entry.text,answer.text+(continuation?" "+next.text:"")]];
  });
}

function showCandidates(candidates) {
  const rows = el("scanRows");
  rows.replaceChildren(...candidates.map(([left, right], index) => {
    const row = document.createElement("tr");
    const values = [null, left, right];
    values.forEach((value, column) => {
      const cell = document.createElement("td");
      const input = document.createElement("input");
      input.type = column === 0 ? "checkbox" : "text";
      input.setAttribute("aria-label", ["Übernehmen", "Vokabel", "Übersetzung"][column] + " " + (index + 1));
      if (column === 0) input.checked = true;
      else input.value = value;
      cell.append(input);
      row.append(cell);
    });
    return row;
  }));
  el("review").hidden = !candidates.length;
  el("scanStatus").textContent = candidates.length
    ? candidates.length + " mögliche Wortpaare. Prüfe die Zuordnung und wähle aus, was übernommen werden soll."
    : "Keine eindeutigen Wortpaare erkannt. Markiere die beiden Wortspalten erneut.";
}

el("acceptScan").onclick = () => {
  const selected = [...el("scanRows").rows].map(row => [...row.querySelectorAll("input")])
    .filter(([check]) => check.checked)
    .map(([,left,right]) => [left.value.trim(), right.value.trim()]);
  if (!selected.length || selected.some(pair => pair.some(word => !word || /\t/.test(word)))) {
    el("scanStatus").textContent = "Wähle mindestens ein vollständiges Paar. Entferne Tabulatoren in den Feldern.";
    return;
  }
  const pairs = el("pairs");
  const existing = pairs.value === pairs.defaultValue ? [] : pairs.value.trim().split(/\r?\n/);
  pairs.value = [...new Set([...existing, ...selected.map(pair => pair.join("\t"))])].filter(Boolean).join("\n");
  el("review").hidden = true;
  el("scanStatus").textContent = selected.length + " ausgewählte Wortpaare übernommen.";
};
el("cancelScan").onclick = () => {
  el("review").hidden = true;
  el("scanStatus").textContent = "Import verworfen.";
};
el("ocr").onclick = async () => {
  const status = el("scanStatus");
  const file = el("scan").files[0];
  if (!file) {
    status.textContent = "Wähle zuerst ein Foto oder einen Scan als Bilddatei.";
    return;
  }
  el("review").hidden = true;
  if (cropBoxes.length !== 2) return;
  scanning = true;
  el("scan").disabled = true;
  el("resetCrop").disabled = true;
  el("ocr").disabled = true;
  el("start").disabled = true;
  status.textContent = "Texterkennung wird geladen …";
  let worker;
  try {
    if (!window.Tesseract) await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
      script.onload = resolve;
      script.onerror = reject;
      document.head.append(script);
    });
    worker = await Tesseract.createWorker("deu+eng");
    await worker.setParameters({tessedit_pageseg_mode:"6"});
    status.textContent = "Das Bild wird gelesen …";
    const results = [];
    for (const box of cropBoxes) {
      const image = document.createElement("canvas");
      const scale = Math.max(1, Math.min(3, 850 / box.w));
      image.width = Math.ceil(box.w * scale);
      image.height = Math.ceil(box.h * scale);
      const ctx = image.getContext("2d");
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, image.width, image.height);
      ctx.drawImage(cropImage, box.x, box.y, box.w, box.h, 0, 0, image.width, image.height);
      clearTableRules(ctx,image.width,image.height);
      const {data} = await worker.recognize(image);
      results.push(columnLines(data, box.y, scale));
    }
    showCandidates(pairColumns(...results));
  } catch {
    status.textContent = "Texterkennung fehlgeschlagen. Prüfe Internetverbindung und Bildqualität.";
  } finally {
    if (worker) await worker.terminate().catch(() => {});
    scanning = false;
    el("scan").disabled = false;
    el("resetCrop").disabled = false;
    el("ocr").disabled = cropBoxes.length !== 2;
    el("start").disabled = false;
  }
};


const deckStorageKey = "vokabelarena.named-decks.1";
let deckRecords = [];
try {
  const raw = JSON.parse(localStorage.getItem(deckStorageKey) ?? "[]");
  if (Array.isArray(raw)) deckRecords = raw.filter(record =>
    typeof record?.title === "string" && typeof record.text === "string");
} catch {
  el("deckStatus").textContent = "Die gespeicherten Listen konnten nicht gelesen werden.";
}

function parsePairs(input) {
  return input.split(/\r?\n/).filter(line => line.trim()).map(line =>
    line.split(line.includes("\t") ? "\t" : ";").map(part => part.trim()));
}

function selectedDeckCards() {
  const inputs = el("deckOptions").querySelectorAll("input:checked");
  const cards = [...inputs].flatMap(input => parsePairs(deckRecords[Number(input.value)].text));
  return [...new Map(cards.map(card => [JSON.stringify(card),card])).values()];
}

function rebuildDeckControls() {
  const checked = new Set([...el("deckOptions").querySelectorAll("input:checked")].map(input => input.value));
  el("deckEdit").replaceChildren(new Option("Liste auswählen",""));
  el("deckOptions").replaceChildren();
  deckRecords.forEach((record,index) => {
    el("deckEdit").add(new Option(record.title,String(index)));
    const choice = document.createElement("input");
    choice.type = "checkbox";
    choice.value = String(index);
    choice.checked = checked.has(choice.value);
    const label = document.createElement("label");
    label.append(choice," "+record.title+" ("+parsePairs(record.text).length+")");
    el("deckOptions").append(label);
  });
  if (!deckRecords.length) el("deckOptions").textContent = "Speichere zuerst eine Liste unter „Eigene Vokabeln“.";
  el("deckLoad").disabled = true;
}

el("deckEdit").onchange = () => {
  el("deckLoad").disabled = el("deckEdit").value === "";
};
el("deckLoad").onclick = () => {
  const record = deckRecords[el("deckEdit").value];
  if (!record) return;
  el("pairs").value = record.text;
  el("deckTitle").value = record.title;
  el("vocabSource").value = "custom";
  setupMode();
  el("pairs").focus();
};
el("deckSave").onclick = () => {
  const title = el("deckTitle").value.trim();
  const input = el("pairs").value.trim();
  const cards = parsePairs(input);
  const status = el("deckStatus");
  if (!title || !cards.length || cards.some(card => card.length !== 2 || card.some(part => !part))) {
    status.textContent = "Gib einen Listennamen und mindestens ein gültiges Vokabelpaar ein.";
    return;
  }
  const existing = deckRecords.findIndex(record => record.title.toLowerCase() === title.toLowerCase());
  if (existing >= 0 && !confirm("Die Liste „"+deckRecords[existing].title+"“ ersetzen?")) return;
  const next = [...deckRecords];
  next[existing < 0 ? next.length : existing] = {title,text:input};
  try {
    localStorage.setItem(deckStorageKey,JSON.stringify(next));
  } catch {
    status.textContent = "Der Browser konnte die Liste nicht speichern.";
    return;
  }
  deckRecords = next;
  rebuildDeckControls();
  status.textContent = "„"+title+"“ gespeichert.";
};
