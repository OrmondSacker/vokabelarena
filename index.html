<style>
:root{color-scheme:dark;font:18px system-ui;background:#141524;color:#faf7ee}
body{margin:0}main{max-width:880px;margin:auto;padding:clamp(18px,5vw,64px)}
h1{font-size:clamp(2.5rem,7vw,5rem);letter-spacing:-.06em;margin:.15em 0}
header p{color:#bdb5f4;margin:0;font-weight:700}
section{background:#22233b;border:1px solid #424461;border-radius:24px;padding:clamp(18px,4vw,36px)}
[hidden]{display:none!important} #pitch{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:20px 0} #pitch span{background:#26604d;border-radius:5px;padding:12px 0} #pitch span.active{background:#9de3b9;color:#14231c} input{font:inherit;max-width:100%} label{display:block;margin:0 0 15px}textarea,select,button{font:inherit;border-radius:10px;padding:10px}textarea{box-sizing:border-box;width:100%;min-height:165px;margin-top:8px}
button{cursor:pointer;border:0;font-weight:700;background:#c3b5ff;color:#18162e;margin:4px}button:focus-visible{outline:3px solid white}button.secondary{background:#383a57;color:white}.correct{background:#9de3b9}.wrong{background:#ffb4a5}
.options,.meters{display:flex;gap:20px;flex-wrap:wrap;align-items:center}.meters>div{flex:1;min-width:155px}progress{width:100%;height:20px;accent-color:#fdac93}
#game{text-align:center}.boss{font-size:4rem;margin:0.25em auto;line-height:1}
#word{font-size:clamp(1.7rem,6vw,3.5rem);overflow-wrap:anywhere;margin:.2em 0}
#answerKey{font-size:.9rem;margin:.2rem 0 .8rem;color:inherit;opacity:.85;overflow-wrap:anywhere}

:root{font-family:"Barlow",system-ui,sans-serif;background:#101821;color:#f1f7fb}
main{max-width:1040px;padding:clamp(14px,4vw,42px)}
header h1{font-size:clamp(2rem,5vw,3.5rem);margin:0 0 .4em}
section{border-radius:18px;background:#192531;border-color:#364b58}
#game{--accent:#80e9bb;position:relative;border-top:4px solid var(--accent);overflow:hidden}
#game[data-mode=zombie]{--accent:#d2ef76;background:radial-gradient(ellipse at top,#34452b,#18231f 65%)}
#game[data-mode=boss]{--accent:#ffb581;background:radial-gradient(ellipse at 50% 0%,#533043,#222139 60%)}
#turn{color:var(--accent);margin:.9em 0 .25em} #score{font-size:clamp(1rem,3vw,1.5rem);font-weight:800;margin:0}
#pitch{position:relative;display:flex;justify-content:space-between;align-items:center;aspect-ratio:4.8;border:2px solid #e5ffed;border-radius:12px;max-width:740px;margin:12px auto;background:repeating-linear-gradient(90deg,#1e684a 0 14.285%,#277c55 14.285% 28.57%)}
#pitch::before{content:"";position:absolute;inset:0 50% 0 auto;border-left:2px solid #e5ffed}
#pitch::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12%;aspect-ratio:1;border:2px solid #e5ffed;border-radius:50%}
#pitch span{z-index:1;background:transparent;flex:1;color:#c9f7d7;font-size:1.3rem}
#pitch span.active{background:transparent;color:white;font-size:clamp(1.15rem,4vw,2.4rem);text-shadow:0 3px 5px #082514}
#pitch span.active{visibility:hidden}
#pitchBall{position:absolute;z-index:2;top:50%;left:var(--ball,50%);transform:translate(-50%,-50%);transition:left .35s ease;font-size:clamp(1rem,4vw,2.5rem);filter:drop-shadow(0 4px 3px #10281e)}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px auto;max-width:720px}
.roster>div{background:#111e1bd9;border:1px solid #607051;border-radius:12px;padding:10px}
.roster strong{display:block;margin-bottom:6px}.roster span{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;margin:3px;border-radius:5px;background:#274a5a;color:#c8eeff;font-weight:800}.roster .infected span{background:#47632b;color:#e9ff9a}
.boss{width:min(31vw,146px);height:auto;aspect-ratio:1.22;margin:14px auto;background:#a865e0;clip-path:polygon(0 0,16% 0,16% 20%,84% 20%,84% 0,100% 0,100% 65%,87% 65%,87% 90%,70% 90%,70% 100%,30% 100%,30% 90%,13% 90%,13% 65%,0 65%);position:relative;box-shadow:inset 0 -20px #6338a0}
.boss::before{content:"";position:absolute;background:#ffdf96;width:16%;height:16%;top:41%;left:22%;box-shadow: min(12.4vw,58px) 0 #ffdf96}
.boss::after{content:"";position:absolute;background:#2b1940;width:30%;height:11%;top:68%;left:35%}
#game[data-hit=right] .boss{animation:hit .38s ease}#game[data-hit=wrong] .boss{animation:lunge .38s ease}
@keyframes hit{30%{transform:translateX(10px);filter:brightness(1.8)}70%{transform:translateX(-8px)}}
@keyframes lunge{50%{transform:scale(1.16)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#judge button,#next{min-width:112px}#feedback{margin:.4em 0}
#review{margin:12px 0 18px;padding:14px;border:1px solid #57727d;border-radius:12px}
#review table{width:100%;border-spacing:4px}#review td:first-child{width:2em}#review input[type=text]{box-sizing:border-box;width:100%;padding:5px}
#names{min-height:80px} #cropStage{overflow:auto;max-height:60vh;max-height:60dvh;background:#121c25;border-radius:8px}#cropCanvas{display:block;touch-action:none;cursor:crosshair}.cropZoom{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}.cropZoom label{display:flex;align-items:center;gap:6px;margin:0}.cropZoom input{width:min(30vw,9rem)}.cropZoom output{min-width:3.6em} #cropHelp{color:#bbefe5}
#game[data-mode=football]{background:radial-gradient(ellipse at top,#274a60,#142331 70%)}
#pitch{margin:24px auto 18px;box-shadow:0 0 0 9px #475e64,0 0 0 13px #263843,0 8px 24px #0008;aspect-ratio:3.8;background:repeating-linear-gradient(90deg,#156a43 0 14.285%,#218555 14.285% 28.57%)}
#pitch span:first-child,#pitch span:nth-child(7){border:2px solid #e5ffed;flex:0 0 12%;margin-inline:4px;background:repeating-linear-gradient(45deg,transparent 0 5px,#c8ffe237 5px 6px);color:transparent}
#game[data-mode=zombie]{background:radial-gradient(circle at 75% 12%,#668059 0 5%,transparent 5.4%),linear-gradient(172deg,#172e39,#40594b 52%,#1a2c27 53%);box-shadow:inset 0 0 60px #0a1718}
.roster>div{border-color:#778e66;box-shadow:0 8px 16px #0005}
.roster span{display:inline-flex;align-items:center;gap:.4em;padding:3px 7px;height:auto;min-height:1.7em;max-width:100%;overflow-wrap:anywhere}
.roster span::before{content:"";width:1em;height:1.25em;flex:none;background:linear-gradient(#ffd1a0 0 44%,#62adf0 44%);clip-path:polygon(26% 0,74% 0,85% 35%,63% 45%,100% 64%,100% 100%,0 100%,0 64%,37% 45%,15% 35%)}
.roster .infected span::before{background:linear-gradient(#b0dc62 0 44%,#805db5 44%)}
#game[data-mode=boss]{background:radial-gradient(ellipse at 50% 32%,#a4496f55,transparent 45%),repeating-linear-gradient(90deg,#211d36 0 12%,#272139 12% 24%);box-shadow:inset 0 0 75px #110d1e}
.boss{width:min(41vw,207px);background:linear-gradient(135deg,#e79df3,#8847be 65%,#45286f);box-shadow:inset 0 -25px #50317a;clip-path:polygon(0 9%,12% 0,24% 26%,76% 26%,88% 0,100% 9%,92% 41%,100% 62%,85% 75%,83% 91%,67% 100%,33% 100%,17% 91%,15% 75%,0 62%,8% 41%)}
.boss::before{left:19%;top:44%;width:62%;height:14%;box-shadow:none;background:linear-gradient(90deg,#ffdb84 31%,transparent 31% 69%,#ffdb84 69%);clip-path:polygon(0 0,40% 35%,60% 35%,100% 0,100% 75%,0 75%)}
.boss::after{background:repeating-linear-gradient(90deg,#ffe5cf 0 12%,#281839 12% 24%);border:3px solid #281839;box-sizing:border-box;border-radius:0 0 40% 40%}
#decksPanel details,#deckPicker{margin:12px 0;border:1px solid #536671;border-radius:12px;padding:12px}#decksPanel summary{cursor:pointer;font-weight:700}#decksPanel label{margin:8px 0}#deckTitle{padding:7px;border-radius:7px}#deckStatus:empty{display:none}#deckOptions label{overflow-wrap:anywhere}
#bossIcon{position:relative;isolation:isolate;display:grid;place-items:center;gap:2px;margin:.55rem auto 0;max-width:560px;min-height:170px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,var(--boss-glow,#ff8655),transparent 64%),linear-gradient(#171720,#292132);border:1px solid #646070;border-radius:14px}
#bossIcon::before{content:"";position:absolute;z-index:-1;inset:52% 0 0;background:repeating-linear-gradient(90deg,transparent 0 12%,#100b2529 12% 13%),linear-gradient(transparent,#0e1126);transform:perspective(100px) rotateX(28deg);transform-origin:bottom}
#bossSprite{display:block;width:clamp(155px,30vw,226px);image-rendering:pixelated;transform-origin:50% 81%;filter:drop-shadow(0 10px 7px #15101b);animation:bossIdle 2.1s ease-in-out infinite}
#bossName{font-size:.95rem;font-weight:800;color:#fff8ee;text-shadow:0 1px 4px #111;position:relative;margin-bottom:7px}
#bossIcon[data-boss=ghost] #bossSprite{animation:ghostIdle 2.55s ease-in-out infinite}
#bossIcon[data-boss=golem] #bossSprite{animation:bossIdle 3.5s ease-in-out infinite}
#bossIcon[data-action=hit] #bossSprite{animation:bossHit .6s ease-out both}
#bossIcon[data-action=defeat] #bossSprite{animation:bossDefeat .65s ease-out both}
#bossIcon[data-action=attack] #bossSprite{animation:bossAttack .65s ease-in-out both}
#bossIcon[data-boss=golem][data-action=attack] #bossSprite{animation:golemAttack .65s ease-in-out both}
#bossIcon[data-boss=ghost][data-action=attack] #bossSprite{animation:ghostAttack .65s ease-in-out both}
#bossEffect{position:absolute;top:12%;right:8%;border:1px solid #ffddad;background:#201520;color:#fff4d1;border-radius:12px;padding:.35em .65em;font-size:clamp(.85rem,3vw,1.3rem);font-weight:900;pointer-events:none;animation:damagePop .65s ease-out both}
#game[data-hit=wrong] #hearts{animation:bossHit .55s ease-out both}
@keyframes bossIdle{50%{transform:translateY(-3%) scale(1.025)}}
@keyframes ghostIdle{50%{transform:translateY(-10%) rotate(4deg);opacity:.83}}
@keyframes bossHit{20%{transform:translateX(8%) rotate(8deg);filter:brightness(2.6)}40%{transform:translateX(-6%) rotate(-5deg)}65%{transform:translateX(3%)}}
@keyframes bossDefeat{25%{filter:brightness(2.7);transform:rotate(8deg)}100%{opacity:.24;transform:translateY(15%) rotate(-15deg) scale(.78)}}
@keyframes bossAttack{24%{transform:translateY(-10%) scale(.92)}52%{transform:translateY(5%) scale(1.22);filter:brightness(1.6) saturate(1.7)}}
@keyframes golemAttack{26%{transform:translateY(-15%) scaleY(1.12)}55%{transform:translateY(10%) scaleX(1.16) scaleY(.83);filter:brightness(1.75)}}
@keyframes ghostAttack{27%{transform:translateX(-14%) skewX(8deg);opacity:.45}55%{transform:translateX(12%) scale(1.23);filter:brightness(1.8)}}
@keyframes damagePop{0%{opacity:0;transform:translateY(6px) scale(.75)}30%{opacity:1;transform:translateY(-5px) scale(1.08)}100%{transform:translateY(-12px)}}
#pitch{isolation:isolate}
.goalMessage{position:absolute;z-index:6;inset:0;display:grid;place-items:center;color:#fff6bc;font:900 clamp(2.5rem,11vw,7rem)/1 system-ui;text-shadow:0 4px 0 #4d3511,0 8px 26px #061315;pointer-events:none;animation:goalZoom 1.25s ease-in-out both}
@keyframes goalZoom{0%{opacity:0;transform:scale(.18)}26%{opacity:1;transform:scale(1.12)}48%{transform:scale(1)}74%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
#classPlayers{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:4px 12px;max-height:14rem;overflow:auto}
#classPlayers label{margin:3px 0;overflow-wrap:anywhere}
#zombieOptions fieldset,#zombieOptions details{padding:10px 12px;margin:10px 0;border:1px solid #536671;border-radius:10px}
#zombieOptions summary{cursor:pointer}
.roster .infected span::before{background:linear-gradient(#bdd97b 0 46%,#9b69c3 46%);animation:zombieSway 1.8s steps(3,end) infinite}
.roster .infected span:nth-of-type(even)::before{animation-delay:-.8s}
.roster .infected .just-infected{animation:zombieInfect .65s ease-out both}
.roster span.has-defended,#targets button.has-defended{background:#3c414c;color:#e0e4ed;opacity:.65}
@keyframes zombieSway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) translateY(-2px)}}
@keyframes zombieInfect{40%{transform:scale(1.18);filter:brightness(1.55)}}
@media(prefers-reduced-motion:reduce){#bossSprite,#bossEffect,.roster span::before,.roster span,#hearts{animation:none!important}.goalMessage{animation:none!important}}
#verbOptions{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.35rem;max-height:15rem;overflow:auto;margin-top:.5rem}
#verbOptions label{display:flex;align-items:center;gap:.4rem;margin:0}
#verbOptions input{width:auto}
#verbOptions [hidden]{display:none}
#bossBonus{color:#ffe3a6;font-weight:700;margin:.5rem 0 .25rem}
#bossProtection{color:#b9e9db;margin:.25rem 0 .5rem}
</style>
<main>
<header><h1>Vokabelarena</h1></header>
<section id="setup">

<form id="config">
<div class="options"><label>Vokabelquelle <select id="vocabSource"><option value="custom">Eigene Vokabeln</option><option value="saved">Gespeicherte Listen</option><option value="verbs">Unregelmäßige Verben</option></select></label><label>Antworten <select id="answerMode"><option value="manual">Mündlich · Lehrkraft wertet</option><option value="typed">Eintippen · automatisch prüfen</option></select></label></div>
<div id="decksPanel">
<details id="deckManager">
<summary>Vokabellisten verwalten</summary>
<label>Listenname <input id="deckTitle" maxlength="120" placeholder="Buch XYZ – Lektion 1"></label>
<button type="button" id="deckSave">Aktuelles Vokabelfeld speichern</button>
<label>Gespeicherte Listen <select id="deckEdit"><option value="">Liste auswählen</option></select></label>
<button type="button" class="secondary" id="deckLoad" disabled>Ins Vokabelfeld laden</button>
<button type="button" class="secondary" id="deckExport">Alle Listen exportieren</button>
<label>Listen importieren <input type="file" id="deckImport" accept=".json,application/json"></label>
</details>
<fieldset id="deckPicker" hidden><legend>Listen für diese Runde</legend><div id="deckOptions"></div><button type="button" class="secondary" id="deckExportSelection">Auswahl exportieren</button></fieldset>
<p id="deckStatus" role="status"></p>
</div>
<div id="customVocabulary">
<label>Vokabelpaare <small>· eine Zeile pro Paar, getrennt durch Tab oder Semikolon</small>
<textarea id="pairs" required spellcheck="false">entscheiden;decide
anbieten;offer
erklären;explain
der Grund;reason
zuverlässig;reliable
die Bestellung;order
verbessern;improve
sich erinnern;remember</textarea></label>
<label>Foto oder Scan <input id="scan" type="file" accept="image/*"></label><div id="cropPanel" hidden><p id="cropHelp" aria-live="polite"></p><div class="cropZoom"><button type="button" class="secondary" id="cropFit">Ganze Seite</button><label for="cropZoom">Zoom <input type="range" id="cropZoom" min="40" max="300" step="10" value="100"></label><output id="cropZoomValue" for="cropZoom">100 %</output></div><div id="cropStage"><canvas id="cropCanvas" aria-label="Buchfoto mit markierbaren Vokabelspalten"></canvas></div><button type="button" class="secondary" id="resetCrop">Markierungen löschen</button><button type="button" class="secondary" id="ocr" disabled>Markierte Spalten lesen</button></div><p id="scanStatus" role="status"></p><div id="review" hidden><table><thead><tr><th>✓</th><th>Vokabel</th><th>Übersetzung</th></tr></thead><tbody id="scanRows"></tbody></table><button type="button" id="acceptScan">Auswahl übernehmen</button><button type="button" class="secondary" id="cancelScan">Verwerfen</button></div></div><div class="options"><label>Spiel <select id="mode"><option value="football">Fußball</option><option value="zombie">Zombieangriff</option><option value="boss">Bosskampf</option></select></label>
<label id="bossChoice" hidden>Boss <select id="bossSelect"><option value="random">Zufällig</option><option value="series">Bossserie · alle drei Bosse</option><option value="dragon">Glutdrache</option><option value="golem">Runengolem</option><option value="ghost">Nebelgeist</option></select></label><label id="bossOptions" hidden>Personen <select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
<label>Abfragerichtung <select id="direction"><option value="0">Links → rechts</option><option value="1">Rechts → links</option><option value="mix">Gemischt (beide Richtungen)</option></select></label>
</div>
<div id="footballOptions"><div class="options"><label>Team 1 <input id="team1" maxlength="40" placeholder="Team 1"></label><label>Team 2 <input id="team2" maxlength="40" placeholder="Team 2"></label></div><label>Spielziel <select id="goals"><option>1</option><option selected>2</option><option>3</option></select> Tore</label></div><div id="zombieOptions" hidden><details><summary>Spieler und Klassen speichern</summary>
<label>Gruppenname <input id="classTitle" maxlength="120" placeholder="z. B. HH 11"></label>
<label>Namen <small>Ein Name pro Zeile. Ein einzelner Name ist ebenfalls möglich.</small>
<textarea id="classNames" rows="3"></textarea></label>
<button type="button" id="classSave">Gruppe speichern</button>
</details>
<label>Spielerauswahl <select id="classLoad"></select></label>
<fieldset id="classChoose" hidden><legend>Spieler für diese Runde</legend>
<button type="button" class="secondary" id="classAll">Alle auswählen</button>
<button type="button" class="secondary" id="classNone">Auswahl aufheben</button>
<p id="classCount" aria-live="polite"></p><div id="classPlayers"></div>
</fieldset><p id="classStatus" role="status"></p><div id="manualPlayers"><label>Spielende, nummeriert <input id="players" type="number" min="2" max="40" value="8"></label><label>Spielernamen <small>· optional, ein Name pro Zeile in der Reihenfolge der Spielernummern</small><textarea id="names" rows="3" placeholder="Alex&#10;Sam&#10;Mika"></textarea></label></div><label>Start-Zombies <input id="zombies" type="number" min="0" value="2"></label><label>Runden bis zur Rettung <input id="rounds" type="number" min="1" max="100" value="4"></label></div><label id="verbLengthWrap" hidden>Umfang <select id="verbLength"><option value="10">10 Verben</option><option value="20">20 Verben</option><option value="all">Alle 334 Verben</option><option value="selected">Verben selbst auswählen</option></select></label>
<fieldset id="verbPicker" hidden><legend>Verben für diese Partie</legend>
<label>Grundform suchen <input id="verbSearch" type="search" spellcheck="false" placeholder="z. B. go"></label>
<button type="button" class="secondary" id="verbSelectVisible">Angezeigte auswählen</button>
<button type="button" class="secondary" id="verbClear">Auswahl aufheben</button>
<p id="verbStatus" role="status"></p><div id="verbOptions"></div>
</fieldset><button id="start">Spiel starten</button>
<p id="error" role="alert" hidden></p>
</form>
</section>
<section id="game" hidden>
<div class="meters" id="bossMeters">
<div><span id="hpLabel"></span><progress id="hp" max="8" aria-label="Boss-Lebenspunkte"></progress></div>
<div><span id="heartsLabel"></span><progress id="hearts" max="4" aria-label="Verbleibende Herzen"></progress></div>
</div>
<div id="bossIcon" hidden><canvas id="bossSprite" width="96" height="72" aria-hidden="true"></canvas><span id="bossName"></span><span id="bossEffect" hidden></span></div><p id="score"></p><div id="pitch" aria-label="Spielfeld"></div><div id="roster" class="roster" hidden></div><div id="targets"></div>
<p id="turn"></p>
<p id="bossBonus" aria-live="polite" hidden></p>
<p id="bossProtection" aria-live="polite" hidden></p>
<h2 id="word" tabindex="-1" aria-live="polite"></h2>
<p id="answerKey" hidden></p>
<p id="feedback" aria-live="polite"></p>
<form id="typedAnswer" hidden autocomplete="off"><label><span id="answerLabel">Antwort</span> <input id="answerInput" required spellcheck="false"></label><label id="partAnswer" hidden>Past Participle <input id="partInput" lang="en" spellcheck="false"></label><button>Prüfen</button></form>
<div id="judge"><button type="button" class="secondary" id="revealAnswer">Lösung anzeigen</button><button type="button" class="correct" id="correct">Richtig</button><button type="button" class="wrong" id="wrong">Falsch</button></div>
<button type="button" id="next" hidden>Weiter</button>
<button type="button" id="nextBoss" hidden>Nächster Boss</button>
<div id="practiceChoice" hidden>
<button type="button" id="practiceRestart">Liste zurücksetzen und weiterspielen</button>
<button type="button" class="secondary" id="practiceStop">Aufhören</button>
</div>
<button type="button" class="secondary" id="back">Zur Einrichtung</button>
</section>
</main>
<script>
"use strict";

function shuffle(cards) {
  const bag = [...cards];
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
  return bag;
}

function makeQuestionQueue(cards, direction) {
  return shuffle(cards).map(card => ({
    card,
    side: direction === "mix" ? Number(Math.random() < 0.5) : Number(direction)
  }));
}

function showPracticeChoice() {
  el("next").hidden = true;
  el("answerKey").hidden = true;
  el("turn").textContent = "Vokabelliste abgeschlossen";
  el("word").textContent = "Alle Vokabeln wurden einmal richtig beantwortet.";
  el("feedback").textContent = "Möchtest du aufhören oder die Liste zurücksetzen und weiterspielen?";
  el("practiceChoice").hidden = false;
  el("practiceRestart").focus();
}

el("practiceRestart").onclick = () => {
  state.queue = makeQuestionQueue(state.cards, state.direction);
  el("practiceChoice").hidden = true;
  question();
};
el("practiceStop").onclick = () => {
  el("practiceChoice").hidden = true;
  el("turn").textContent = "Spiel beendet";
  el("word").textContent = "Alle Vokabeln geschafft!";
  el("feedback").textContent = "";
  el("back").focus();
};

function meters() {
  if (state.mode !== "boss") return;
  el("hp").max = state.maxHp;
  el("hearts").max = state.maxHearts;
  el("hp").value = state.hp;
  el("hearts").value = state.hearts;
  el("hpLabel").textContent = bossRoster[state.boss].name + " · " + state.hp + "/" + state.maxHp + " LP";
  el("heartsLabel").textContent = "Ihr · " + state.hearts + "/" + state.maxHearts + " Herzen";
}

function question() {
  if (!state.queue.length) {
    state.queue = shuffle(state.missed);
    state.missed = [];
    if (!state.queue.length) {
      showPracticeChoice();
      return;
    }
  }
  if (state.mode === "zombie" && state.target == null) {
    chooseTarget();
    return;
  }
  delete el("game").dataset.hit;
  if (state.mode === "boss") resetBossEffect();
  state.current = state.queue.shift();
  if (state.bossStage === 2 && state.direction === "mix" && !state.current.retry) {
    state.current.side = state.nextSide;
    state.nextSide = 1 - state.nextSide;
  }
  state.pending = true;
  el("turn").textContent = state.mode === "football" ? state.teamNames[state.team] + " ist dran" : state.mode === "zombie" ? playerName(state.target) + " verteidigt sich" : "Person " + (state.answered % state.count + 1) +
    " ist dran";
  el("word").textContent = state.current.card[state.current.side];
  el("feedback").textContent = "";
  el("answerKey").hidden = true;
  el("judge").hidden = state.typed;
  if (state.mode === "boss") renderBossBonus();
  else el("revealAnswer").disabled = false;
  el("typedAnswer").hidden = !state.typed;
  el("typedAnswer").reset();
  el("answerLabel").textContent = state.verbs ? "Simple Past" : "Antwort";
  el("partAnswer").hidden = !state.verbs;
  el("partInput").required = state.verbs;
  el("next").hidden = true;
  el(state.typed ? "answerInput" : "word").focus();
}

function currentSolution() {
  const {card,side} = state.current;
  return state.verbs ? card[1] + " · " + card[2] : card[1-side];
}

el("revealAnswer").onclick = () => {
  if (el("revealAnswer").disabled) return;
  const {card,side} = state.current;
  el("word").textContent = currentSolution();
  el("answerKey").textContent = card[side];
  el("answerKey").hidden = false;
};

function normalizeAnswer(value) {
  return value.normalize("NFC").trim().replace(/\s+/g," ").toLowerCase();
}

el("typedAnswer").onsubmit = event => {
  event.preventDefault();
  if (!state?.pending || !state.typed) return;
  const matches = (input, solution, separator) =>
    [solution, ...solution.split(separator)].some(form => normalizeAnswer(form) === normalizeAnswer(input));
  const {card,side} = state.current;
  const answer = el("answerInput").value;
  if (state.verbs) {
    judge(matches(answer,card[1],"/") && matches(el("partInput").value,card[2],"/"));
  } else {
    judge(matches(answer,card[1-side],/;|\s+\/\s+/));
  }
};
function judge(correct) {
  if (!state.pending) return;
  if (!correct && state.mode === "boss" && state.protections.delete("retry")) {
    renderBossBonus();
    el("feedback").textContent = "Zweite Chance! Versuche dieselbe Frage noch einmal.";
    if (state.typed) el("typedAnswer").reset();
    el(state.typed ? "answerInput" : "word").focus();
    return;
  }
  state.pending = false;
  el("game").dataset.hit = correct ? "right" : "wrong";
  state.answered++;
  if (!correct) state.missed.push({...state.current, retry:true});
  const solution = currentSolution();
  el("typedAnswer").hidden = true;
  if (state.mode !== "boss") {
    judgeTeam(correct, solution);
    return;
  }
  let message;
  if (correct) {
    state.streak++;
    const bonus = state.streak === state.bonusAt ? state.bonus : null;
    const damage = Math.min(state.hp, bonus === "double" ? 2 : 1);
    state.hp -= damage;
    animateBoss(true,damage);
    message = (bonus === "double" ? "Doppeltreffer! " : "Treffer! ") + "Der Boss verliert " + damage + " LP.";
    if (bonus) {
      if (bonus === "heal") {
        state.hearts++;
        message += " Heiltrank: +1 Herz.";
      } else if (bonus !== "double") {
        state.protections.add(bonus);
        message += " " + bossBonuses[bonus] + " ist jetzt aktiv.";
      }
      state.streak = 0;
      drawBossBonus();
    }
  } else if (state.protections.delete("stamina")) {
    message = "Ausdauertrank verbraucht. Herz und Serie bleiben erhalten. Richtige Lösung: " + solution;
  } else {
    state.hearts--;
    animateBoss(false,1);
    state.streak = 0;
    message = "Richtige Lösung: " + solution;
  }
  renderBossBonus();
  meters();
  el("feedback").textContent = message;
  el("judge").hidden = true;
  if (state.hp === 0 && state.bossStage != null && state.bossStage + 1 < bossSeries.length) {
    el("answerKey").hidden = true;
    el("turn").textContent = "Boss " + (state.bossStage + 1) + " von " + bossSeries.length + " besiegt";
    el("word").textContent = bossRoster[state.boss].name + " besiegt!";
    el("nextBoss").hidden = false;
    el("nextBoss").focus();
    return;
  }
  if (state.hp === 0 || state.hearts === 0) {
    el("answerKey").hidden = true;
    el("turn").textContent = "Kampf beendet";
    el("word").textContent = state.hp === 0 ? (state.bossStage == null ? "Boss besiegt!" : "Bossserie gewonnen!") : "Der Boss hat gewonnen.";
    el("back").focus();
    return;
  }
  el("next").hidden = false;
  el("next").focus();
}

el("correct").onclick = () => judge(true);
el("wrong").onclick = () => judge(false);
el("next").onclick = question;
el("back").onclick = () => {
  el("game").hidden = true;
  el("setup").hidden = false;
  el("pairs").focus();
};

function renderTeam() {
  if (state.mode === "football") {
    el("score").textContent = state.teamNames[0] + "  ·  " + state.goals.join(" : ") + "  ·  " + state.teamNames[1];
    const pitch = el("pitch");
    pitch.style.setProperty("--ball", ((state.ball + 0.5) * 100 / 7) + "%");
    pitch.setAttribute("aria-label", "Ball auf Position " + (state.ball + 1) + " von 7");
    if (!pitch.children.length) pitch.replaceChildren(...Array.from({length:7}, (_, index) => {
      const tile = document.createElement("span");
      tile.textContent = index === 0 || index === 6 ? "🥅" : "·";
      tile.setAttribute("aria-hidden", "true");
      return tile;
    }));
    if (!el("pitchBall")) {
      const ball = document.createElement("div");
      ball.id = "pitchBall";
      ball.textContent = "⚽";
      ball.setAttribute("aria-hidden", "true");
      pitch.append(ball);
    }
  }
  if (state.mode === "zombie") {
    el("roster").replaceChildren(rosterGroup("Zombies", state.attackers, true), rosterGroup("Überlebende", state.survivors, false));
    el("score").textContent = state.round === 0 ? "Vorrunde · "+state.answered+"/"+(state.answered+state.opening.length+(state.pending ? 1 : 0)) :
      "Runde "+state.round+"/"+state.maxRounds+" · Angriffe "+state.attackIndex+"/"+state.attackOrder.length;
  }
}

function playerName(id) {
  return state.names[id - 1] || "Person " + id;
}

function rosterGroup(label, people, infected) {
  const group = document.createElement("div");
  group.classList.toggle("infected", infected);
  const title = document.createElement("strong");
  title.textContent = label + " · " + people.length;
  group.append(title);
  for (const person of people) {
    const badge = document.createElement("span");
    badge.textContent = playerName(person);
    badge.classList.toggle("has-defended", !infected && state.waiting.has(person));
    badge.classList.toggle("just-infected", infected && state.lastInfected === person);
    group.append(badge);
  }
  return group;
}


function beginZombieRound() {
  state.attackOrder = shuffle(state.attackers);
  state.attackIndex = 0;
}
function availableSurvivors() {
  const eligible = state.survivors.filter(person => !state.waiting.has(person));
  if (eligible.length) return eligible;
  state.waiting.clear();
  return state.survivors;
}
function pickZombieTarget(person) {
  state.target = person;
  el("targets").replaceChildren();
  question();
}
function chooseTarget() {
  if (state.opening.length) {
    pickZombieTarget(state.opening.shift());
    return;
  }
  el("typedAnswer").hidden = true;
  el("answerKey").hidden = true;
  el("turn").textContent = playerName(state.attackOrder[state.attackIndex]) + " wählt als Zombie";
  el("word").textContent = "Wer verteidigt sich?";
  el("feedback").textContent = "";
  el("judge").hidden = true;
  el("next").hidden = true;
  const eligible = new Set(availableSurvivors());
  renderTeam();
  el("targets").replaceChildren(...state.survivors.map(person => {
    const button = document.createElement("button");
    button.textContent = playerName(person);
    button.disabled = !eligible.has(person);
    button.classList.toggle("has-defended", button.disabled);
    if (button.disabled) button.title = "Hat bereits verteidigt";
    button.onclick = () => pickZombieTarget(person);
    return button;
  }));
  el("targets").querySelector("button:not(:disabled)")?.focus();
}

function advanceZombie(correct) {
  const wasOpening = state.round === 0;
  const target = state.target;
  state.target = null;
  if (correct) {
    state.waiting.add(target);
  } else {
    state.survivors = state.survivors.filter(person => person !== target);
    state.attackers.push(target);
  }
  state.lastInfected = correct ? null : target;
  const event = correct ? "" : " " + playerName(target) + " wird zum Zombie!";
  if (!state.survivors.length) return {event,result:"Die Zombies gewinnen!"};

  if (!wasOpening) state.attackIndex++;
  const roundOver = wasOpening ? !state.opening.length : state.attackIndex === state.attackOrder.length;
  if (!roundOver) return {event,result:""};
  if (!state.attackers.length || state.round === state.maxRounds) {
    return {event,result:"Die Überlebenden gewinnen!"};
  }
  state.round++;
  beginZombieRound();
  return {event,result:""};
}

function judgeTeam(correct, solution) {
  const message = correct ? "Richtig!" : "Richtige Lösung: " + solution;
  let result = "";
  let event = "";
  if (state.mode === "football") {
    if (correct) state.ball += state.team === 0 ? 1 : -1;
    if (state.ball === 0 || state.ball === 6) {
      state.goals[state.team]++;
      flashGoal();
      event = " Tor für " + state.teamNames[state.team] + "!";
      if (state.goals[state.team] === state.goalLimit) result = state.teamNames[state.team] + " gewinnt!";
      else state.ball = 3;
    }
    state.team = 1 - state.team;
  } else {
    ({event,result} = advanceZombie(correct));
  }
  renderTeam();
  el("feedback").textContent = message + event;
  el("judge").hidden = true;
  if (result) {
    el("answerKey").hidden = true;
    el("turn").textContent = "Spiel beendet";
    el("word").textContent = result;
    el("back").focus();
  } else {
    el("next").hidden = false;
    el("next").focus();
  }
}

const verbChoices = verbBank.map(([base], index) => {
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.value = String(index);
  const label = document.createElement("label");
  label.append(checkbox, " " + base);
  el("verbOptions").append(label);

function plausibleEntry(text) {
  const words = text.match(/\p{L}[\p{L}'’.-]*/gu) ?? [];
  if (!words.length || words.length > 9 || text.length > 100) return false;
  if (/^\s*(?:unit|lesson|chapter|seite|page|kapitel|lektion|übungen?|exercises?|examples?|beispiele?|vocabulary|wortschatz|vokabeln|english|deutsch)\s*[\d:.\-]*\s*$/iu.test(text)) return false;
  if (/^[„“"»(]\s*|\b(?:e\.g\.|z\.\s*b\.|example:|beispiel:)|[!?]$|[.]\s+\p{Lu}/iu.test(text)) return false;
  if (words.length >= 3 && /\.$/.test(text)) return false;
  return !/^(?:S\.|p\.)?\s*\d+[\s\d./–-]*$/i.test(text);
}


let cropImage, cropBoxes = [], dragStart, scanning = false, requestId = 0;

function sizeCropPreview() {
  if (!cropImage || cropStage.getBoundingClientRect().width === 0) return;
  const zoom = Number(cropZoom.value);
  const maxHeight = parseFloat(getComputedStyle(cropStage).maxHeight) || innerHeight * .6;
  const scale = Math.min(cropStage.getBoundingClientRect().width / canvas.width,
    maxHeight / canvas.height, 1) * zoom / 100;
  canvas.style.width = Math.floor(canvas.width * scale) + "px";
  el("cropZoomValue").value = zoom + " %";
}

function box(a,b) {
  return {x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)};
}
function redraw(preview) {
  const ctx=canvas.getContext("2d");
  ctx.drawImage(cropImage,0,0);
  for(const [i,r] of [...cropBoxes,...(preview?[preview]:[])].entries()) {
    ctx.strokeStyle=i?"#137de5":"#008354";
    ctx.fillStyle=i?"#137de533":"#00835433";
    ctx.lineWidth=4;
    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeRect(r.x,r.y,r.w,r.h);
  }
  el("cropHelp").textContent=[
    "Markiere die englischen Stichwörter in der Tabelle.",
    "Markiere die deutschen Übersetzungen in denselben Zeilen. Lass die Beispielsätze aus.",
    "Beide Spalten markiert. Starte die Texterkennung."
  ][cropBoxes.length];
  el("ocr").disabled=scanning || cropBoxes.length!==2;
}
function point(event) {
  const r=canvas.getBoundingClientRect();
  return {x:Math.min(canvas.width,Math.max(0,(event.clientX-r.left)*canvas.width/r.width)),
    y:Math.min(canvas.height,Math.max(0,(event.clientY-r.top)*canvas.height/r.height))};
}
canvas.onpointerdown=event=>{
  if(scanning || cropBoxes.length===2 || event.button!==0 || !event.isPrimary)return;
  canvas.setPointerCapture(event.pointerId);
  dragStart=point(event);
};
canvas.onpointermove=event=>{if(dragStart && event.isPrimary)redraw(box(dragStart,point(event)));};
canvas.onpointerup=event=>{
  if(!dragStart || !event.isPrimary)return;
  const r=box(dragStart,point(event));
  dragStart=null;
  if(r.w>12 && r.h>12)cropBoxes.push(r);
  redraw();
};
canvas.onpointercancel=()=>{dragStart=null;redraw();};
el("resetCrop").onclick=()=>{

};
el("scan").onchange=async()=>{

  }finally{URL.revokeObjectURL(url);}
};


function clearTableRules(ctx,width,height) {
  const image=ctx.getImageData(0,0,width,height);
  const gray=new Uint8Array(width*height);
  const mask=new Uint8Array(gray.length);
  for(let i=0;i<gray.length;i++) {
    const k=i*4;
    gray[i]=Math.round(.3*image.data[k]+.59*image.data[k+1]+.11*image.data[k+2]);
  }
  const stride=Math.max(3,Math.floor(width/85));
  const radius=Math.max(2,Math.round(width/315));
  for(let slope=-.14;slope<=.061;slope+=.0125) {
    for(let y=0;y<height;y+=radius) {
      let hit=0,total=0;
      for(let x=0;x<width;x+=stride) {
        const cy=y+Math.round((x-width/2)*slope);
        if(cy<radius || cy>=height-radius)continue;
        total++;
        for(let dy=-radius;dy<=radius;dy++) {
          if(gray[(cy+dy)*width+x]<191){hit++;break;}
        }
      }
      if(total<width/stride*.75 || hit<total*.64)continue;
      for(let x=0;x<width;x++) {
        const cy=y+Math.round((x-width/2)*slope);
        for(let dy=-radius;dy<=radius;dy++) {
          const row=cy+dy;
          if(row<0 || row>=height)continue;
          const k=row*width+x;
          if(gray[k]>95 || (gray[k-width*(radius+1)]>148 && gray[k+width*(radius+1)]>148))mask[k]=1;
        }
      }
    }
  }
  for(let i=0;i<gray.length;i++) {
    const value=mask[i] || gray[i]>177 ? 255 : Math.max(0,Math.round((gray[i]-25)*1.5));
    image.data[i*4]=image.data[i*4+1]=image.data[i*4+2]=value;
  }
  ctx.putImageData(image,0,0);
}

function columnLines(data, offset, scale) {
  return (data.lines ?? []).filter(line => line.bbox).map(({text,bbox}) => ({
    text:text.trim(), y:offset+(bbox.y0+bbox.y1)/2/scale, height:(bbox.y1-bbox.y0)/scale
  })).filter(line=>line.text).sort((a,b)=>a.y-b.y);
}


function pairColumns(left,right) {
  const entries = left.map(line => ({
    ...line,
    text: line.text.replace(/^[\s\d\u2022\u00b7.*-]+/,"").split(/[\[\/]/,1)[0].trim()
  })).filter(line => line.text);
  const answers = right.filter(line => line.text);
  if (!entries.length || !answers.length) return [];

  const median = numbers => [...numbers].sort((a,b) => a-b)[Math.floor(numbers.length/2)];
  const height = median([...entries,...answers].map(line => line.height).filter(value => value > 0)) || 12;
  const gaps = lines => lines.slice(1).map((line,i) => line.y-lines[i].y);
  const rowGap = median([...gaps(entries),...gaps(answers)].filter(gap => gap > height*1.55)) || height*2;
  const tolerance = Math.max(height*.75,rowGap*.36);
  const offsets = entries.map(entry => answers.reduce((best,line) =>
    Math.abs(line.y-entry.y)<Math.abs(best.y-entry.y) ? line : best).y-entry.y);
  const offset = median(offsets);

  const candidates = [];
  let first = 0;
  entries.forEach((entry,i) => {
    if (!plausibleEntry(entry.text)) return;
    const target = entry.y+offset;
    while (first < answers.length && answers[first].y < target-tolerance) first++;
    for (let j=first; j<answers.length && answers[j].y<=target+tolerance; j++) {
      if (plausibleEntry(answers[j].text)) candidates.push({i,j,distance:Math.abs(answers[j].y-target)});
    }
  });

  const usedLeft = new Set(), usedRight = new Set(), anchors = [];
  candidates.sort((a,b) => a.distance-b.distance);
  for (const match of candidates) {
    if (usedLeft.has(match.i) || usedRight.has(match.j) ||
        anchors.some(anchor => (anchor.i-match.i)*(anchor.j-match.j) < 0)) continue;
    anchors.push(match);
    usedLeft.add(match.i);
    usedRight.add(match.j);
  }
  anchors.sort((a,b) => a.i-b.i);

  function readCell(lines,start,end,followingY) {
    let value = lines[start].text;
    for (let i=start+1; i<end; i++) {
      const line = lines[i];
      const gap = line.y-lines[i-1].y;
      const maxGap = Math.max(height*1.65,Math.min(height*2,rowGap*.78));
      if (gap > maxGap || line.y >= followingY-height*.48 || !/\p{L}/u.test(line.text)) break;
      value += " " + line.text;
    }
    return value;
  }

  return anchors.map((anchor,k) => {
    const next = anchors[k+1];
    return [
      readCell(entries,anchor.i,next?.i ?? entries.length,next ? answers[next.j].y-offset : Infinity),
      readCell(answers,anchor.j,next?.j ?? answers.length,next ? entries[next.i].y+offset : Infinity)
    ];
  });
}

function showCandidates(candidates) {
  const rows = el("scanRows");
  rows.replaceChildren(...candidates.map(([left, right], index) => {
    const row = document.createElement("tr");
    const values = [null, left, right];
    values.forEach((value, column) => {
      const cell = document.createElement("td");
      const input = document.createElement("input");
      input.type = column === 0 ? "checkbox" : "text";
      input.setAttribute("aria-label", ["Übernehmen", "Vokabel", "Übersetzung"][column] + " " + (index + 1));
      if (column === 0) input.checked = true;
      else input.value = value;
      cell.append(input);
      row.append(cell);
    });
    return row;
  }));
  el("review").hidden = !candidates.length;
  el("scanStatus").textContent = candidates.length
    ? candidates.length + " mögliche Wortpaare. Prüfe die Zuordnung und wähle aus, was übernommen werden soll."
    : "Keine eindeutigen Wortpaare erkannt. Markiere die beiden Wortspalten erneut.";
}

el("acceptScan").onclick = () => {
  const selected = [...el("scanRows").rows].map(row => [...row.querySelectorAll("input")])
    .filter(([check]) => check.checked)
    .map(([,left,right]) => [left.value.trim(), right.value.trim()]);
  if (!selected.length || selected.some(pair => pair.some(word => !word || /\t/.test(word)))) {
    el("scanStatus").textContent = "Wähle mindestens ein vollständiges Paar. Entferne Tabulatoren in den Feldern.";
    return;
  }
  const pairs = el("pairs");
  const existing = pairs.value === pairs.defaultValue ? [] : pairs.value.trim().split(/\r?\n/);
  pairs.value = [...new Set([...existing, ...selected.map(pair => pair.join("\t"))])].filter(Boolean).join("\n");
  el("review").hidden = true;
  el("scanStatus").textContent = selected.length + " ausgewählte Wortpaare übernommen.";
};
el("cancelScan").onclick = () => {
  el("review").hidden = true;
  el("scanStatus").textContent = "Import verworfen.";
};
el("ocr").onclick = async () => {
  const status = el("scanStatus");
  const file = el("scan").files[0];
  if (!file) {
    status.textContent = "Wähle zuerst ein Foto oder einen Scan als Bilddatei.";
    return;
  }
  el("review").hidden = true;
  if (cropBoxes.length !== 2) return;
  scanning = true;
  el("scan").disabled = true;
  el("resetCrop").disabled = true;
  el("ocr").disabled = true;
  el("start").disabled = true;
  status.textContent = "Texterkennung wird geladen …";
  let worker;
  try {
    if (!window.Tesseract) await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
      script.onload = resolve;
      script.onerror = reject;
      document.head.append(script);
    });
    worker = await Tesseract.createWorker("deu+eng");
    await worker.setParameters({tessedit_pageseg_mode:"6"});
    status.textContent = "Das Bild wird gelesen …";
    const results = [];
    for (const box of cropBoxes) {
      const image = document.createElement("canvas");
      const scale = Math.max(1, Math.min(3, 850 / box.w));
      image.width = Math.ceil(box.w * scale);
      image.height = Math.ceil(box.h * scale);
      const ctx = image.getContext("2d");
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, image.width, image.height);
      ctx.drawImage(cropImage, box.x, box.y, box.w, box.h, 0, 0, image.width, image.height);
      clearTableRules(ctx,image.width,image.height);
      const {data} = await worker.recognize(image);
      results.push(columnLines(data, box.y, scale));
    }
    showCandidates(pairColumns(...results));
  } catch {
    status.textContent = "Texterkennung fehlgeschlagen. Prüfe Internetverbindung und Bildqualität.";
  } finally {
    if (worker) await worker.terminate().catch(() => {});
    scanning = false;
    el("scan").disabled = false;
    el("resetCrop").disabled = false;
    el("ocr").disabled = cropBoxes.length !== 2;
    el("start").disabled = false;
  }
};

function parsePairs(input) {
  return input.split(/\r?\n/).filter(line => line.trim()).map(line =>
    line.split(line.includes("\t") ? "\t" : ";").map(part => part.trim()));
}

function selectedDeckCards() {
  const inputs = el("deckOptions").querySelectorAll("input:checked");
  const cards = [...inputs].flatMap(input => parsePairs(deckRecords[Number(input.value)].text));
  return [...new Map(cards.map(card => [JSON.stringify(card),card])).values()];
}

function rebuildDeckControls() {
  const checked = new Set([...el("deckOptions").querySelectorAll("input:checked")].map(input => input.value));
  el("deckEdit").replaceChildren(new Option("Liste auswählen",""));
  el("deckOptions").replaceChildren();
  deckRecords.forEach((record,index) => {
    el("deckEdit").add(new Option(record.title,String(index)));
    const choice = document.createElement("input");
    choice.type = "checkbox";
    choice.value = String(index);
    choice.checked = checked.has(choice.value);
    const label = document.createElement("label");
    label.append(choice," "+record.title+" ("+parsePairs(record.text).length+")");
    el("deckOptions").append(label);
  });
  if (!deckRecords.length) el("deckOptions").textContent = "Speichere zuerst eine Liste unter „Eigene Vokabeln“.";
  el("deckLoad").disabled = true;
}

el("deckSave").onclick = () => {
  const title = el("deckTitle").value.trim();
  const input = el("pairs").value.trim();
  const cards = parsePairs(input);
  const status = el("deckStatus");
  if (!title || !cards.length || cards.some(card => card.length !== 2 || card.some(part => !part))) {
    status.textContent = "Gib einen Listennamen und mindestens ein gültiges Vokabelpaar ein.";
    return;
  }
  const existing = deckRecords.findIndex(record => record.title.toLowerCase() === title.toLowerCase());
  if (existing >= 0 && !confirm("Die Liste „"+deckRecords[existing].title+"“ ersetzen?")) return;
  const next = [...deckRecords];
  next[existing < 0 ? next.length : existing] = {title,text:input};
  try {
    localStorage.setItem(deckStorageKey,JSON.stringify(next));
  } catch {
    status.textContent = "Der Browser konnte die Liste nicht speichern.";
    return;
  }
  deckRecords = next;
  rebuildDeckControls();
  status.textContent = "„"+title+"“ gespeichert.";
};

function drawBoss() {
  const ctx = el("bossSprite").getContext("2d");
  ctx.clearRect(0,0,96,72);
  function polygon(color, points) {
    ctx.beginPath();
    for (const [i,[x,y]] of points.entries()) {
      if (i === 0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
  function block(color,x,y,w,h) {
    ctx.fillStyle = color;
    ctx.fillRect(x,y,w,h);
  }

  const sprite = state.boss;
  const colors = {
    dragon:["#361927","#ae4846","#fc8050","#ffe685"],

    ghost:["#2b1a44","#814bb4","#c78cf5","#fff0ff"]
  }[sprite];
  const [outline,shade,light,eyes] = colors;
  for (const side of [-1,1]) {
    ctx.save();
    ctx.translate(48,0);
    ctx.scale(side,1);
    if (sprite === "dragon") {
      polygon(outline,[[0,42],[12,23],[37,9],[32,29],[44,52],[29,46],[19,56],[9,51]]);
      polygon(shade,[[9,39],[33,13],[27,29],[38,45],[27,40],[19,50]]);

      polygon(shade,[[16,28],[30,28],[38,39],[37,50],[31,55],[20,50],[13,41]]);

      polygon(shade,[[7,37],[22,38],[26,46],[36,49],[33,54],[23,50],[17,60],[8,53],[2,59]]);
      block(light,35,29,4,4);block(light,31,63,3,3);
    }
    ctx.restore();
  }

  if (sprite === "golem") {
    polygon(outline,[[26,40],[35,13],[59,13],[70,38],[66,66],[30,66]]);
    polygon(shade,[[29,43],[39,28],[57,29],[66,43],[62,62],[34,62]]);
    polygon(light,[[35,25],[39,17],[56,17],[62,24],[59,35],[36,35]]);
    block(outline,38,26,20,7);block(eyes,40,27,4,3);block(eyes,52,27,4,3);
    polygon(eyes,[[48,40],[55,47],[48,54],[41,47]]);
    block(outline,46,45,4,4);
  } else {

    polygon(outline,[[24,48],[28,top+8],[38,top],[57,top],[68,top+8],[74,48],[65,62],[33,62]]);
    polygon(shade,[[29,46],[33,top+9],[40,top+4],[55,top+4],[64,top+10],[69,46],[60,57],[36,57]]);
    polygon(light,[[34,38],[39,top+10],[56,top+10],[62,38],[55,45],[41,45]]);
    block(outline,35,37,10,6);block(outline,51,37,10,6);
    block(eyes,40,38,4,3);block(eyes,52,38,4,3);
    block(outline,42,49,12,5);
    if (sprite === "dragon") {
      block(eyes,39,52,4,5);block(eyes,54,52,4,5);
    }
  }
}

  {boss:"dragon", hp:6, hearts:4, bonusAt:3},
  {boss:"golem", hp:8, hearts:3, bonusAt:4},
  {boss:"ghost", hp:10, hearts:2, bonusAt:5}
];

el("nextBoss").onclick = () => {
  state.bossStage++;
  prepareBoss();
  meters();
  el("nextBoss").hidden = true;
  question();
};

function prepareBoss(requested) {
  const stage = bossSeries[state.bossStage];
  state.boss = stage?.boss ?? (requested === "random" ? shuffle(Object.keys(bossRoster))[0] : requested);
  state.maxHp = stage?.hp ?? 8;
  state.maxHearts = stage?.hearts ?? 4;
  state.bonusAt = stage?.bonusAt ?? 3;
  state.hp = state.maxHp;
  state.hearts = Math.min(state.hearts, state.maxHearts);
  state.streak = 0;
  state.protections ??= new Set();
  drawBossBonus();
  renderBossBonus();
  const {name,color} = bossRoster[state.boss];
  const arena = el("bossIcon");
  arena.dataset.boss = state.boss;
  arena.style.setProperty("--boss-glow",color);
  el("bossName").textContent = stage ? "Boss " + (state.bossStage + 1) + "/" + bossSeries.length + " · " + name : name;
  resetBossEffect();
  drawBoss();
}
function resetBossEffect() {
  delete el("bossIcon").dataset.action;
  el("bossEffect").hidden = true;
}
function animateBoss(correct, damage) {
  const action = correct ? (state.hp === 0 ? "defeat" : "hit") : "attack";
  el("bossIcon").dataset.action = action;
  const effect = el("bossEffect");
  effect.textContent = correct ? "−"+damage+" LP" : bossRoster[state.boss].attack+" · −1 Herz";
  effect.hidden = false;
}
function flashGoal() {
  el("pitch").querySelector(".goalMessage")?.remove();
  const message = document.createElement("div");
  message.className = "goalMessage";
  message.textContent = "TOR!";
  message.setAttribute("aria-hidden","true");
  el("pitch").append(message);
  setTimeout(() => message.remove(),1250);
}


const classStorage = "vokabelarena.classes.1";
const readNames = value => value.split(/\r?\n/).map(name => name.trim()).filter(Boolean);
let classRecords = [];
try {
  const raw = JSON.parse(localStorage.getItem(classStorage) ?? "[]");
  if (Array.isArray(raw)) classRecords = raw.filter(item => typeof item?.title === "string" &&
    Array.isArray(item.names) && item.names.every(name => typeof name === "string"));
} catch {
  el("classStatus").textContent = "Gruppen konnten nicht geladen werden.";
}

function classSelection() {
  return [...el("classPlayers").querySelectorAll("input:checked")].map(box => box.value);
}
function syncClassCount() {
  const selected = classSelection().length;
  el("classCount").textContent = selected + " ausgewählt";
}
function renderClassPlayers() {
  const selected = el("classLoad").value;
  const record = selected === "all" ? {names:[...new Set(classRecords.flatMap(group => group.names))]} : classRecords[selected];
  el("classChoose").hidden = !record;
  el("manualPlayers").hidden = Boolean(record);
  el("players").required = !record;
  el("players").disabled = Boolean(record) || el("mode").value !== "zombie";
  if (record?.title) {
    el("classTitle").value = record.title;
    el("classNames").value = record.names.join("\n");
  }
  el("classPlayers").replaceChildren(...(record?.names ?? []).map(name => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = true;
    input.value = name;
    input.onchange = syncClassCount;
    label.append(input," "+name);
    return label;
  }));
  syncClassCount();
}
function refreshClasses(index = "") {
  el("classLoad").replaceChildren(new Option("Manuelle Eingabe",""),
    ...classRecords.map((record,i) => new Option(record.title,String(i))));
  if (classRecords.length) el("classLoad").add(new Option("Alle gespeicherten Spieler","all"));
  el("classLoad").value = String(index);
  renderClassPlayers();
}
el("classLoad").onchange = renderClassPlayers;
el("classAll").onclick = () => {
  for (const box of el("classPlayers").querySelectorAll("input")) box.checked = true;
  syncClassCount();
};
el("classNone").onclick = () => {
  for (const box of el("classPlayers").querySelectorAll("input")) box.checked = false;
  syncClassCount();
};
el("classSave").onclick = () => {
  const title = el("classTitle").value.trim();
  const names = readNames(el("classNames").value);
  const status = el("classStatus");
  if (!title || !names.length) {
    status.textContent = "Gib einen Gruppennamen und mindestens einen Spielernamen ein.";
    return;
  }
  const index = classRecords.findIndex(record => record.title.toLowerCase() === title.toLowerCase());
  if (index >= 0 && !confirm("Gruppe „"+classRecords[index].title+"“ ersetzen?")) return;
  const next = [...classRecords];
  const slot = index < 0 ? next.length : index;
  next[slot] = {title,names};
  try {
    localStorage.setItem(classStorage,JSON.stringify(next));
  } catch {
    status.textContent = "Die Gruppe konnte nicht gespeichert werden.";
    return;
  }
  classRecords = next;
  refreshClasses(slot);
  status.textContent = "Gruppe gespeichert.";
};
refreshClasses();


function exportDecks(selectedOnly) {
  const indices = new Set([...el("deckOptions").querySelectorAll("input:checked")].map(input => Number(input.value)));
  const lists = selectedOnly ? deckRecords.filter((_,i) => indices.has(i)) : deckRecords;
  if (!lists.length) {
    el("deckStatus").textContent = selectedOnly ? "Hake zuerst mindestens eine Liste an." : "Es gibt noch keine gespeicherten Listen.";
    return;
  }
  const blob = new Blob([JSON.stringify({format:"vokabelarena-listen",version:1,lists},null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "Vokabelarena-Listen.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
  el("deckStatus").textContent = lists.length + " Liste(n) exportiert.";
}
el("deckExport").onclick = () => exportDecks(false);
el("deckExportSelection").onclick = () => exportDecks(true);
el("deckImport").onchange = async event => {
  const input = event.currentTarget;
  const file = input.files[0];
  if (!file) return;
  input.disabled = true;
  const status = el("deckStatus");
  try {
    if (file.size > 10_000_000) throw Error("file too large");
    const data = JSON.parse(await file.text());
    if (data?.format !== "vokabelarena-listen" || data.version !== 1 || !Array.isArray(data.lists) || !data.lists.length) throw Error("unrecognized format");
    const incoming = data.lists.map(entry => {
      if (typeof entry?.title !== "string" || typeof entry.text !== "string") throw Error("invalid list");
      const title = entry.title.trim(), text = entry.text.trim(), cards = parsePairs(text);
      if (!title || title.length > 120 || !cards.length || cards.some(pair => pair.length !== 2 || pair.some(part => !part))) throw Error("invalid pairs");
      return {title,text};
    });
    const updated = [...deckRecords];
    for (const {title,text} of incoming) {
      let name = title;
      let counter = 2;
      let match = updated.find(record => record.title.toLowerCase() === name.toLowerCase());
      while (match && match.text !== text) {
        const suffix = " (" + counter + ")";
        counter++;
        name = title.slice(0,120-suffix.length)+suffix;
        match = updated.find(record => record.title.toLowerCase() === name.toLowerCase());
      }
      if (!match) updated.push({title:name,text});
    }
    localStorage.setItem(deckStorageKey,JSON.stringify(updated));
    const count = updated.length-deckRecords.length;
    deckRecords = updated;
    rebuildDeckControls();
    status.textContent = count ? count+" Liste(n) importiert. Bestehende Listen wurden nicht überschrieben." : "Diese Listen sind bereits gespeichert.";
  } catch {
    status.textContent = "Import fehlgeschlagen. Prüfe die Vokabelarena-JSON-Datei und den verfügbaren Speicher.";
  } finally {
    input.value = "";
    input.disabled = false;
  }
};

</script>
