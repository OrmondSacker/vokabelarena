<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurvenchaos · Vokabelarena</title>
<link rel="stylesheet" href="race.css?v=wald13">
<main>
<header><a href="./">← Vokabelarena</a><h1>Kurvenchaos</h1><button id="restart" hidden>Neues Rennen</button></header>
<form id="setup"><label>Anzahl der Wagen <select id="count"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label><div id="names"></div><button>Rennen starten</button></form>
<section id="race" hidden>
<div class="layout"><div id="track" aria-label="Rennstrecke mit 47 Feldern vom Start bis zum Ziel"></div><div class="race-sidebar">
<section class="dice-panel" aria-labelledby="dice-title">
  <h2 id="dice-title">Würfel</h2>
  <div id="dice-tray" hidden></div>
  <p id="dice-result" role="status"></p>
  <div id="dice-actions"></div>
</section>
<aside><h2>Rangliste</h2><ol id="standings"></ol><details><summary>Streckenfelder</summary><p>🃏 Karte · 🔧 Werkstatt · ❗ Panne · ↗ Abkürzung · + / − Zusatzbewegung</p><p>Werkstätten zählen auch beim Vorbeifahren. Abkürzungen beginnen auf dem markierten Feld.</p></details></aside></div>
<div class="controls"><div><strong id="turn"></strong><p id="status" role="status"></p></div><div id="choices"></div><div class="hand-panel"><h2>Deine Handkarten</h2><div id="hand" aria-label="Aktionskarten"></div></div></div>
</div>
<dialog id="card-reveal" aria-labelledby="reveal-mode reveal-name" aria-describedby="reveal-description">
  <form method="dialog" class="reveal-layout">
    <p id="reveal-mode"></p>
    <p id="reveal-caption"></p>
    <article class="reveal-card">
      <span id="reveal-kind" class="card-kind"></span>
      <h2 id="reveal-name"></h2>
      <div id="reveal-icon"></div>
      <p id="reveal-description"></p>
    </article>
    <button id="reveal-continue" class="primary" autofocus>Weiter</button>
  </form>
</dialog>
</section>
</main>
<script src="race-art.js?v=wald5"></script>
<script src="race.js?v=wald14"></script>
</html>
